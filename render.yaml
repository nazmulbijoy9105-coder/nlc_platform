services:
  - type: web
    name: nlc-platform
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /api/v1/health/live
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: NLC_RLS_HMAC_SECRET
        sync: false
      - key: REQUIRE_RLS_APP_ROLE
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://nlc-frontend.vercel.app,http://localhost:3000
