services:
  - type: web
    name: nlc-platform
    runtime: docker
    region: singapore
    plan: starter
    healthCheckPath: /api/v1/health/live
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://nlc-frontend.vercel.app,http://localhost:3000
      - key: RULE_ENGINE_VERSION
        value: "2.1.0"
      - key: ILRMF_VERSION
        value: "1.0.0"
