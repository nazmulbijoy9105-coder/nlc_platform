envVarGroups:
  - name: nlc-rls-signing-secret-20261104
    envVars:
      - key: NLC_RLS_HMAC_SECRET
        generateValue: true

services:
  - type: web
    name: nlc-platform
    runtime: docker
    region: singapore
    plan: starter
    healthCheckPath: /api/v1/health/live
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - fromGroup: nlc-rls-signing-secret-20261104
      - key: SENTRY_DSN
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://nlc-frontend.vercel.app,http://localhost:3000

  - type: worker
    name: nlc-worker
    runtime: docker
    region: singapore
    plan: starter
    dockerCommand: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - fromGroup: nlc-rls-signing-secret-20261104
      - key: ENVIRONMENT
        value: production

  - type: worker
    name: nlc-beat
    runtime: docker
    region: singapore
    plan: starter
    dockerCommand: celery -A app.worker.celery_app beat --loglevel=info
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - fromGroup: nlc-rls-signing-secret-20261104
      - key: ENVIRONMENT
        value: production
