name: Global Uptime Monitor - Render API

on:
  schedule:
    - cron: '*/10 3-15 * * *'   # 9 AM–9 PM Bangladesh (UTC+6)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health Check
        run: |
          curl --fail \
               --retry 3 \
               --retry-delay 5 \
               --connect-timeout 10 \
               --max-time 30 \
               https://nlc-platform.onrender.com/api/v1/health
