name: Build reviewed Pillow Brotli 1.2.1 CPython 3.11 wheel
# Publish only the artifact produced by the exact current security branch head.

on:
  push:
    branches:
      - security/remediate-12-findings
    paths:
      - scripts/build_pillow_brotli121_cp311_wheel.sh
      - .github/workflows/pillow-brotli121-cp311-wheel.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pillow-brotli121-cp311-wheel0480-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build Pillow 13.0.0 / Brotli 1.2.1 (CPython 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out NLC build recipe
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up CPython 3.11 build controller
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify Docker builder availability
        run: |
          set -euo pipefail
          docker info >/dev/null

      - name: Validate build script syntax
        run: bash -n scripts/build_pillow_brotli121_cp311_wheel.sh

      - name: Build wheel and run Pillow's own cibuildwheel test suite
        run: bash scripts/build_pillow_brotli121_cp311_wheel.sh

      - name: Upload wheel, checksum, and build provenance
        uses: actions/upload-artifact@v4
        with:
          name: pillow-13.0.0-brotli1.2.1-cp311-wheel0480-manylinux-x86_64
          path: dist/pillow-brotli121/*
          if-no-files-found: error
          retention-days: 30

  publish-reviewed-artifact:
    name: Publish tested wheel as a prerelease asset
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested wheel and provenance
        uses: actions/download-artifact@v4
        with:
          name: pillow-13.0.0-brotli1.2.1-cp311-wheel0480-manylinux-x86_64
          path: dist/pillow-brotli121

      - name: Publish immutable prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="nlc-pillow-13.0.0-brotli1.2.1-cp311-wheel0480"
          branch_head="$(gh api "repos/$GITHUB_REPOSITORY/branches/security%2Fremediate-12-findings" --jq '.commit.sha')"
          if [[ "$branch_head" != "$GITHUB_SHA" ]]; then
            echo "Build belongs to stale commit $GITHUB_SHA; current branch head is $branch_head. Refusing publication."
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to replace existing Pillow wheel release $tag" >&2
            exit 1
          fi
          mapfile -t wheels < <(find dist/pillow-brotli121 -maxdepth 1 -type f -name '*.whl' -print)
          test "${#wheels[@]}" -eq 1
          test -s dist/pillow-brotli121/SHA256SUMS
          test -s dist/pillow-brotli121/BUILD_PROVENANCE.txt
          gh release create "$tag" \
            "${wheels[0]}" \
            dist/pillow-brotli121/SHA256SUMS \
            dist/pillow-brotli121/BUILD_PROVENANCE.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Pillow 13.0.0 with Brotli 1.2.1 (CPython 3.11, wheel 0.48.0)" \
            --prerelease \
            --notes "Reviewed NLC build of the upstream Pillow 13.0.0 source commit. Only the Pillow wheel dependency manifest changes Brotli from 1.2.0 to 1.2.1. Built with Pillow's cibuildwheel recipe; the wheel test command runs Pillow's own suite. The attached provenance and SHA256SUMS identify the exact artifact. This is a temporary compatibility wheel, not an upstream Pillow release. The wheel tag rewriter is pinned to wheel 0.48.0 and recorded in BUILD_PROVENANCE.txt."
          gh release view "$tag" --repo "$GITHUB_REPOSITORY"
