name: PostgreSQL role membership audit (isolated)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-role-memberships:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nlc_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nlc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nlc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://nlc_test@localhost:5432/nlc_test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PostgreSQL driver
        run: python -m pip install --no-cache-dir asyncpg

      - name: Create isolated least-privilege role fixtures
        run: |
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def main():
              url = os.environ["DATABASE_URL"].replace(
                  "postgresql+asyncpg://", "postgresql://", 1
              )
              conn = await asyncpg.connect(url)
              try:
                  await conn.execute("""
                      CREATE ROLE nlc_app_role LOGIN NOSUPERUSER NOCREATEDB
                          NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
                      CREATE ROLE nlc_ci_audit_role LOGIN NOSUPERUSER NOCREATEDB
                          NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
                  """)
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

      - name: Run read-only role membership audit against local PostgreSQL
        run: |
          PGOPTIONS='-c default_transaction_read_only=on' \
            psql -h localhost -U nlc_test -d nlc_test -X -v ON_ERROR_STOP=1 \
            -f scripts/audit_nlc_role_memberships.sql
