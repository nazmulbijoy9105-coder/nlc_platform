name: Tenant isolation (RLS)

# P0: multi-tenant legal data must not leak across company boundaries.
# Runs company-access / RLS / tenant unit gates and compiles verification helpers.
# Route-auth inventory lives under tests/security and is enforced by CI unit/security
# paths — not this job.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tenant-isolation:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://dummy:dummy@localhost:5432/dummy
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-jwt-secret-not-for-production-2026
      NLC_RLS_HMAC_SECRET: ci-only-rls-hmac-secret-not-for-production-2026
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Company-access and isolation unit gates
        run: |
          set -euo pipefail
          ARGS=()
          for path in \
            tests/unit/test_company_access.py \
            tests/unit/test_dependencies_company_access.py \
            tests/unit/test_rls.py \
            tests/unit/test_tenant_isolation.py
          do
            if [[ -e "$path" ]]; then
              ARGS+=("$path")
            fi
          done
          if ((${#ARGS[@]} == 0)); then
            python -m pytest tests/unit -q --tb=short -k "company_access or tenant or rls or membership"
          else
            python -m pytest "${ARGS[@]}" -q --tb=short
          fi

      - name: Compile RLS verification entrypoints
        run: |
          set -euo pipefail
          for script in verify_rls.py verify_tenant_isolation.py; do
            if [[ -f "$script" ]]; then
              python -m py_compile "$script"
              echo "compiled $script"
            fi
          done
