name: Dependency license policy

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "50 5 * * 1"

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies and inventory tool
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-licenses

      - name: Enforce explicit approved-license allowlist
        run: |
          set -euo pipefail
          mkdir -p artifacts
          pip-licenses --format=json --with-urls --with-description > artifacts/python-licenses.json
          pip-licenses --format=markdown --with-urls > artifacts/python-licenses.md
          python scripts/check_dependency_licenses.py artifacts/python-licenses.json

      - name: Upload license inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-license-inventory
          path: |
            artifacts/python-licenses.json
            artifacts/python-licenses.md
          if-no-files-found: warn
