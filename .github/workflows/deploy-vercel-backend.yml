# CI-gated Render deployment. Render's native autoDeploy remains disabled.
# A deploy is triggered only after CI and production migrations succeed,
# and only after the protected GitHub Environment "production" is approved.

name: Deploy Backend (Render)

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: nlc-platform-production-render-deploy
  cancel-in-progress: false

jobs:
  deploy-render:
    name: Migrate then deploy Render
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.NLC_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    # Human approval required before production migrate/deploy (dual-path control).
    # Configure required reviewers on the GitHub Environment named "production".
    environment: production
    steps:
      - name: Checkout the CI-tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Require legal-engine P0 assurance for this exact release SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/$REPOSITORY/actions/workflows/legal-engine-assurance.yml/runs?head_sha=$TARGET_SHA&per_page=20"
          for attempt in $(seq 1 40); do
            RESPONSE=$(curl --silent --show-error --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API_URL")
            RUN=$(jq -c --arg sha "$TARGET_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha and .event == "push")]
              | sort_by(.run_started_at // .created_at)
              | last // empty
            ' <<<"$RESPONSE")
            if [[ -n "$RUN" ]]; then
              STATUS=$(jq -r '.status // empty' <<<"$RUN")
              CONCLUSION=$(jq -r '.conclusion // empty' <<<"$RUN")
              RUN_URL=$(jq -r '.html_url // empty' <<<"$RUN")
              echo "Legal-engine assurance status=$STATUS conclusion=$CONCLUSION url=$RUN_URL"
              if [[ "$STATUS" == "completed" ]]; then
                if [[ "$CONCLUSION" == "success" ]]; then
                  echo "Exact-SHA legal-engine P0 assurance passed: $TARGET_SHA"
                  exit 0
                fi
                echo "::error::Legal-engine P0 assurance did not succeed for $TARGET_SHA (conclusion=$CONCLUSION)."
                exit 1
              fi
            else
              echo "No push-triggered legal-engine assurance run for $TARGET_SHA yet."
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for exact-SHA legal-engine P0 assurance. No migration or deployment is permitted."
          exit 1

      - name: Skip stale CI results
        id: freshness
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ -z "$CURRENT_MAIN_SHA" ]]; then
            echo "::error::Could not resolve current main SHA."
            exit 1
          fi
          if [[ "$CURRENT_MAIN_SHA" == "$TARGET_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "CI-tested SHA $TARGET_SHA is current main."
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale CI result $TARGET_SHA; current main is $CURRENT_MAIN_SHA."
          fi

      - name: Set up Python for live dependency audit
        if: steps.freshness.outputs.current == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pinned pip-audit release-gate tool
        if: steps.freshness.outputs.current == 'true'
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pip-audit==2.7.1"

      - name: Require all security-closure items to be CLOSED and audit current dependencies (audit F-12)
        if: steps.freshness.outputs.current == 'true'
        run: python scripts/check_security_closure.py

      - name: Retain live dependency audit report
        if: always() && steps.freshness.outputs.current == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-security-dependency-audit
          path: artifacts/security/pip-audit-current.json
          if-no-files-found: warn
          retention-days: 90

      - name: Verify Render target and disabled native auto-deploy
        if: steps.freshness.outputs.current == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-d72sam94tr6s73dk8etg
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_API_KEY:-}" || -z "${RENDER_SERVICE_ID:-}" ]]; then
            echo "::error::Render API key or service ID is missing; aborting before production migration."
            exit 1
          fi
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$BODY_FILE"' EXIT
          HTTP_STATUS="$(curl --silent --show-error --output "$BODY_FILE" \
            --write-out '%{http_code}' --connect-timeout 10 --max-time 20 \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Accept: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID")"
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "::error::Unable to verify Render service configuration (HTTP $HTTP_STATUS). Aborting before migration."
            exit 1
          fi
          AUTO_DEPLOY="$(jq -r '.autoDeployTrigger // .autoDeploy // empty' "$BODY_FILE")"
          if [[ "$AUTO_DEPLOY" != "off" && "$AUTO_DEPLOY" != "no" ]]; then
            echo "::error::Render native auto-deploy must be off; observed '$AUTO_DEPLOY'. Aborting before migration."
            exit 1
          fi
          echo "Render service identity verified and native auto-deploy is disabled."

      # Migrations run from the CI-tested image, before any production deploy.
      # The credential is a GitHub Actions secret, not a Render API env var.
      - name: Apply production migrations before Render deploy
        if: steps.freshness.outputs.current == 'true'
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.NLC_MIGRATION_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MIGRATION_DATABASE_URL:-}" ]]; then
            echo "::error::NLC_MIGRATION_DATABASE_URL is not configured. No Render deployment will be triggered."
            exit 1
          fi
          docker build --target api --tag nlc-api:migration .
          docker run --rm \
            --entrypoint /bin/sh \
            --env ENVIRONMENT=production \
            --env NLC_ALEMBIC_METADATA_ONLY=1 \
            --env MIGRATION_DATABASE_URL \
            nlc-api:migration \
            -c '
              set -eu
              HEADS="$(alembic heads)"
              HEAD_COUNT="$(printf "%s\\n" "$HEADS" | sed "/^[[:space:]]*$/d" | wc -l | tr -d " ")"
              if [ "$HEAD_COUNT" -ne 1 ]; then
                echo "Expected exactly one Alembic head; got $HEAD_COUNT"
                printf "%s\\n" "$HEADS"
                exit 1
              fi
              EXPECTED_HEAD="$(printf "%s\\n" "$HEADS" | awk "NR == 1 {print \\$1}")"
              BEFORE="$(alembic current)"
              echo "Database Alembic revision before migration:"
              printf "%s\\n" "$BEFORE"
              alembic upgrade head
              AFTER="$(alembic current)"
              echo "Database Alembic revision after migration:"
              printf "%s\\n" "$AFTER"
              CURRENT_COUNT="$(printf "%s\\n" "$AFTER" | sed "/^[[:space:]]*$/d" | wc -l | tr -d " ")"
              if [ "$CURRENT_COUNT" -ne 1 ] || ! printf "%s\\n" "$AFTER" | grep -Fq "$EXPECTED_HEAD"; then
                echo "Database did not finish at the sole repository head $EXPECTED_HEAD"
                exit 1
              fi
            '
          echo "Production Alembic migration completed and exact single head verified."

      - name: Trigger Render deployment for the exact CI-tested commit
        id: trigger
        if: steps.freshness.outputs.current == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-d72sam94tr6s73dk8etg
          EXPECTED_DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_API_KEY:-}" || -z "${RENDER_SERVICE_ID:-}" || -z "${EXPECTED_DEPLOYED_SHA:-}" ]]; then
            echo "::error::RENDER_API_KEY, service ID, and expected commit SHA are required. No deployment was triggered."
            exit 1
          fi
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$BODY_FILE"' EXIT
          HTTP_STATUS="$(curl --silent --show-error --output "$BODY_FILE" \
            --write-out '%{http_code}' --connect-timeout 10 --max-time 30 \
            --request POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "$(jq -cn --arg sha "$EXPECTED_DEPLOYED_SHA" '{commitId:$sha}')")"
          echo "Render deploy API HTTP status: $HTTP_STATUS"
          if [[ "$HTTP_STATUS" != "201" ]]; then
            echo "::error::Render deploy API did not return HTTP 201."
            head -c 1000 "$BODY_FILE" || true
            echo
            exit 1
          fi
          DEPLOYMENT_ID="$(jq -r '.id // empty' "$BODY_FILE")"
          RETURNED_SHA="$(jq -r '.commit.id // empty' "$BODY_FILE")"
          if [[ -n "$RETURNED_SHA" && "$RETURNED_SHA" != "$EXPECTED_DEPLOYED_SHA" ]]; then
            echo "::error::Render accepted a different commit: expected $EXPECTED_DEPLOYED_SHA, got $RETURNED_SHA."
            exit 1
          fi
          echo "Render accepted the exact requested commit; deploy reference: ${DEPLOYMENT_ID:-not-returned}"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$EXPECTED_DEPLOYED_SHA" >> "$GITHUB_OUTPUT"

      - name: Poll Render until the exact commit is live
        id: verify-deploy
        if: steps.trigger.outcome == 'success'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-d72sam94tr6s73dk8etg
          EXPECTED_DEPLOYED_SHA: ${{ steps.trigger.outputs.expected_sha }}
          TRIGGERED_DEPLOYMENT_ID: ${{ steps.trigger.outputs.deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_API_KEY:-}" || -z "${EXPECTED_DEPLOYED_SHA:-}" ]]; then
            echo "::error::Cannot verify deployment without Render API credentials and expected SHA."
            exit 1
          fi
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$BODY_FILE"' EXIT
          for attempt in $(seq 1 90); do
            HTTP_STATUS="$(curl --silent --show-error --output "$BODY_FILE" \
              --write-out '%{http_code}' --connect-timeout 10 --max-time 20 \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=100")" || HTTP_STATUS="000"
            echo "Render deploy-list poll $attempt/90: HTTP $HTTP_STATUS"
            if [[ "$HTTP_STATUS" == "200" ]]; then
              MATCH="$(jq -c --arg sha "$EXPECTED_DEPLOYED_SHA" '
                [ .[] | (.deploy // .) | select(.commit.id == $sha) ]
                | sort_by(.createdAt // "")
                | last // empty
              ' "$BODY_FILE")"
              if [[ -n "$MATCH" && "$MATCH" != "null" ]]; then
                DEPLOYMENT_ID="$(jq -r '.id // empty' <<<"$MATCH")"
                DEPLOYED_SHA="$(jq -r '.commit.id // empty' <<<"$MATCH")"
                DEPLOY_STATUS="$(jq -r '.status // empty' <<<"$MATCH")"
                if [[ -n "$TRIGGERED_DEPLOYMENT_ID" && "$DEPLOYMENT_ID" != "$TRIGGERED_DEPLOYMENT_ID" ]]; then
                  echo "::error::Render deploy list returned a different deployment ID than the trigger response."
                  exit 1
                fi
                echo "Matched deployment $DEPLOYMENT_ID commit=$DEPLOYED_SHA status=$DEPLOY_STATUS"
                if [[ "$DEPLOYED_SHA" != "$EXPECTED_DEPLOYED_SHA" ]]; then
                  echo "::error::Deployment SHA mismatch."
                  exit 1
                fi
                case "$DEPLOY_STATUS" in
                  live)
                    echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
                    echo "deployed_sha=$DEPLOYED_SHA" >> "$GITHUB_OUTPUT"
                    exit 0
                    ;;
                  build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                    echo "::error::Exact commit deployment reached terminal failure status $DEPLOY_STATUS."
                    exit 1
                    ;;
                esac
              fi
            else
              echo "Render deploy list not yet available; will retry within the bounded polling window."
            fi
            if [[ "$attempt" -lt 90 ]]; then sleep 20; fi
          done
          echo "::error::No deployment for expected SHA $EXPECTED_DEPLOYED_SHA reached live status within 30 minutes."
          exit 1

      - name: Wait and verify backend health
        if: steps.verify-deploy.outcome == 'success'
        env:
          DEPLOYMENT_ID: ${{ steps.verify-deploy.outputs.deployment_id }}
          EXPECTED_DEPLOYED_SHA: ${{ steps.verify-deploy.outputs.deployed_sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting 3 minutes for Render deployment reference $DEPLOYMENT_ID to start..."
          sleep 180
          HEALTH_URL="https://nlc-platform.onrender.com/api/v1/health/live"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$BODY_FILE"' EXIT
          for attempt in 1 2 3 4 5; do
            if STATUS="$(curl --silent --show-error --output "$BODY_FILE" \
              --write-out '%{http_code}' --connect-timeout 10 --max-time 15 \
              "$HEALTH_URL")"; then
              :
            else
              STATUS="000"
            fi
            echo "Deployment $DEPLOYMENT_ID — health probe $attempt/5: HTTP $STATUS"
            if [[ "$STATUS" == "200" ]]; then
              echo "Backend liveness passed."
              head -c 1000 "$BODY_FILE"
              echo
              exit 0
            fi
            if [[ -s "$BODY_FILE" ]]; then
              head -c 1000 "$BODY_FILE"
              echo
            fi
            if [[ "$attempt" -lt 5 ]]; then sleep 30; fi
          done
          echo "::error::Deployment $DEPLOYMENT_ID did not become live after five probes."
          exit 1

      - name: Verify backend readiness
        if: steps.verify-deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="https://nlc-platform.onrender.com/api/v1/health/ready"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$BODY_FILE"' EXIT
          for attempt in 1 2 3 4 5; do
            if STATUS="$(curl --silent --show-error --output "$BODY_FILE" \
              --write-out '%{http_code}' --connect-timeout 10 --max-time 20 \
              "$HEALTH_URL")"; then
              :
            else
              STATUS="000"
            fi
            echo "Readiness probe $attempt/5: HTTP $STATUS"
            if [[ "$STATUS" == "200" ]]; then
              head -c 1000 "$BODY_FILE"
              echo
              exit 0
            fi
            if [[ -s "$BODY_FILE" ]]; then head -c 1000 "$BODY_FILE"; echo; fi
            if [[ "$attempt" -lt 5 ]]; then sleep 30; fi
          done
          echo "::error::Backend readiness did not pass after five probes."
          exit 1

      - name: Report skipped stale CI result
        if: steps.freshness.outputs.current == 'false'
        run: echo "No migration or deploy was triggered because main advanced after this CI run."
