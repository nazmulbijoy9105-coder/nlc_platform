# =============================================================================
# GitHub Actions: Trigger Render Backend Redeploy on Push to main
# Backend: https://nlc-platform.onrender.com
# =============================================================================

name: Deploy Backend (Render)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-render:
    name: Trigger Render Redeploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        id: trigger
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RENDER_DEPLOY_HOOK:-}" ]]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not configured."
            echo "Configure it in GitHub Actions secrets before triggering a deployment."
            exit 1
          fi

          echo "Triggering Render deploy..."
          if RESPONSE=$(curl --silent --show-error --fail-with-body --max-time 30 \
            --request POST "$RENDER_DEPLOY_HOOK"); then
            echo "Render accepted the deploy request."
          else
            echo "::error::Render deploy hook request failed."
            exit 1
          fi

          # Render's response contains a deployment identifier, not the hook URL.
          DEPLOYMENT_ID=$(printf '%s' "$RESPONSE" | python -c \
            'import json,sys; data=json.load(sys.stdin); print(data.get("deploy", {}).get("id", ""))') || {
              echo "::error::Could not parse the Render deployment response."
              exit 1
            }
          if [[ -z "$DEPLOYMENT_ID" ]]; then
            echo "::error::Render response did not contain a deployment ID."
            exit 1
          fi

          echo "Render deployment ID: $DEPLOYMENT_ID"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Wait and verify backend health
        env:
          DEPLOYMENT_ID: ${{ steps.trigger.outputs.deployment_id }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting 3 minutes for Render deployment $DEPLOYMENT_ID to start..."
          sleep 180

          HEALTH_URL="https://nlc-platform.onrender.com/api/v1/health/live"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$BODY_FILE"' EXIT

          for attempt in 1 2 3 4 5; do
            # A curl transport failure is a failed probe (000), not a shell failure.
            if STATUS=$(curl --silent --show-error --output "$BODY_FILE" \
              --write-out '%{http_code}' --connect-timeout 10 --max-time 15 \
              "$HEALTH_URL"); then
              :
            else
              STATUS="000"
            fi

            echo "Deployment $DEPLOYMENT_ID — health probe $attempt/5: HTTP $STATUS"
            if [[ "$STATUS" == "200" ]]; then
              echo "Backend health check passed."
              head -c 1000 "$BODY_FILE"
              echo
              exit 0
            fi

            if [[ -s "$BODY_FILE" ]]; then
              echo "Health response body (first 1000 bytes):"
              head -c 1000 "$BODY_FILE"
              echo
            fi

            if [[ "$attempt" -lt 5 ]]; then
              echo "Health check not ready; retrying in 30 seconds..."
              sleep 30
            fi
          done

          echo "::error::Deployment $DEPLOYMENT_ID did not become healthy after five probes."
          exit 1
