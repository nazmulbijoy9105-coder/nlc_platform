name: Worker health

# P1: Celery app import and beat schedule must stay loadable.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  celery-smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://dummy:dummy@localhost:5432/dummy
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-jwt-secret-not-for-production-2026
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import Celery app and inspect schedule
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib

          # Prefer documented entrypoint; fall back to package layout.
          candidates = [
              "app.worker.celery_app",
              "app.worker",
              "app.workers.celery_app",
          ]
          mod = None
          errors = []
          for name in candidates:
              try:
                  mod = importlib.import_module(name)
                  print(f"imported {name}")
                  break
              except Exception as exc:  # noqa: BLE001 — collect import attempts
                  errors.append(f"{name}: {exc}")
          if mod is None:
              raise SystemExit("Could not import Celery app:\n" + "\n".join(errors))

          app = getattr(mod, "celery_app", None) or getattr(mod, "app", None)
          if app is None:
              # Module may *be* the app
              if hasattr(mod, "conf"):
                  app = mod
              else:
                  raise SystemExit(f"No celery app object on {mod}")

          # Beat schedule presence is informational if empty (some envs inject later).
          schedule = getattr(app.conf, "beat_schedule", None) or {}
          print(f"beat_schedule entries: {len(schedule)}")
          for key in sorted(schedule)[:20]:
              print(f"  - {key}")
          print("worker health smoke OK")
          PY
