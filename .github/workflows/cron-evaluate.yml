name: Daily Compliance Evaluation

on:
  schedule:
    # Every day at 00:00 UTC (6:00 AM Bangladesh time)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-compliance-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate cron secret and wait for API readiness
        shell: bash
        env:
          NLC_CRON_SECRET: ${{ secrets.NLC_CRON_SECRET }}
        run: |
          set -Eeuo pipefail

          : "${NLC_CRON_SECRET:?Required GitHub Actions secret NLC_CRON_SECRET is missing or empty}"

          # A free Render web service may be asleep. Retry only the harmless
          # health check so the service can wake before the non-idempotent POST.
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --retry 4 --retry-all-errors --retry-delay 10 \
            "https://nlc-platform.onrender.com/api/v1/admin/cron/health" \
            --output /dev/null

          # The API endpoint validates CRON_SECRET using a constant-time
          # comparison before granting its narrowly scoped cron admin context.
          # Do not retry this POST: a timeout could occur after DB work commits.
          evaluation_response="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 180 \
            --request POST "https://nlc-platform.onrender.com/api/v1/admin/cron/evaluate-all" \
            --header "X-Cron-Secret: $NLC_CRON_SECRET")"

          jq -e '
            .status == "complete"
            and (.total_companies | type == "number" and . > 0)
            and (.evaluated | type == "number")
            and (.errors | type == "number" and . == 0)
            and (.evaluated == .total_companies)
          ' <<<"$evaluation_response" >/dev/null

          total="$(jq -r '.total_companies' <<<"$evaluation_response")"
          evaluated="$(jq -r '.evaluated' <<<"$evaluation_response")"
          errors="$(jq -r '.errors' <<<"$evaluation_response")"
          unset evaluation_response NLC_CRON_SECRET

          echo "Evaluation result: total=$total evaluated=$evaluated errors=$errors"
