name: API contract smoke

# P0: keep a stable OpenAPI surface for nlc_frontend and external clients.
# Exports the schema and fails if the app cannot import or generate docs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  openapi-contract:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://dummy:dummy@localhost:5432/dummy
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-jwt-secret-not-for-production-2026
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export OpenAPI schema
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path

          from app.main import app

          schema = app.openapi()
          assert isinstance(schema, dict), "OpenAPI schema must be a dict"
          assert schema.get("openapi"), "OpenAPI version missing"
          paths = schema.get("paths") or {}
          assert paths, "OpenAPI paths must not be empty"
          # Stable prefixes the frontend and ops rely on
          required_prefixes = (
              "/api/v1/health",
              "/api/v1/auth",
              "/api/v1/companies",
              "/api/v1/rules",
          )
          joined = " ".join(paths.keys())
          missing = [p for p in required_prefixes if p not in joined and not any(k.startswith(p) for k in paths)]
          if missing:
              raise SystemExit(f"Required API prefixes missing from OpenAPI: {missing}")
          out = Path("artifacts/openapi-contract.json")
          out.write_text(json.dumps(schema, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"Exported {len(paths)} paths to {out}")
          PY

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: artifacts/openapi-contract.json
          if-no-files-found: error
