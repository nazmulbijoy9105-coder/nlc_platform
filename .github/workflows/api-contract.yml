name: API contract smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  openapi-contract:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://dummy:dummy@localhost:5432/dummy
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-jwt-secret-not-for-production-2026
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export and validate exact OpenAPI client contract
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m scripts.check_openapi_contract --output artifacts/openapi-contract.json

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: artifacts/openapi-contract.json
          if-no-files-found: error
