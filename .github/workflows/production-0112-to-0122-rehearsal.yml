name: Production 0112 to 0123 Neon Migration Rehearsal

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "alembic/**"
      - "alembic.ini"
      - "app/**"
      - "canonical_architecture/statutory_rules.py"
      - "requirements.txt"
      - "scripts/rehearse_production_0112_to_0122.py"
      - ".github/workflows/production-0112-to-0122-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nlc-production-0112-0123-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: rapid-bonus-26545234
      NEON_PARENT_BRANCH_ID: br-divine-glade-aovapmi5
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install migration dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Create a fresh isolated Neon child of the verified backup
        id: provision
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NEON_API_KEY:-}" ]]; then
            echo "::error::NEON_API_KEY repository secret is required."
            exit 1
          fi

          API="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID"
          AUTH=(-H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json" -H "Content-Type: application/json")
          parent_json=$(curl --silent --show-error --fail "${AUTH[@]}" "$API/branches/$NEON_PARENT_BRANCH_ID")
          parent_name=$(jq -r '.branch.name // empty' <<<"$parent_json")
          parent_default=$(jq -r 'if .branch.default == null then "unknown" else (.branch.default | tostring) end' <<<"$parent_json")
          if [[ "$parent_name" != "nlc-prod-backup-2026-11-20-before-0122" || "$parent_default" != "false" ]]; then
            echo "::error::Pinned source is not the expected non-default production backup branch."
            exit 1
          fi

          branch_name="nlc-ci-rehearsal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload=$(jq -n --arg name "$branch_name" --arg parent "$NEON_PARENT_BRANCH_ID" \
            '{branch:{name:$name,parent_id:$parent},endpoints:[{type:"read_write"}]}')
          created=$(curl --silent --show-error --fail --request POST "${AUTH[@]}" \
            --data "$payload" "$API/branches")
          branch_id=$(jq -r '.branch.id // empty' <<<"$created")
          endpoint_id=$(jq -r '[.endpoints[]? | select(.type == "read_write") | .id][0] // empty' <<<"$created")
          if [[ -n "$branch_id" ]]; then
            echo "branch_id=$branch_id" >> "$GITHUB_OUTPUT"
          fi
          if [[ -z "$branch_id" || -z "$endpoint_id" ]]; then
            echo "::error::Neon did not return both the new branch ID and its read-write endpoint ID; cleanup will still target the created branch."
            exit 1
          fi
          echo "endpoint_id=$endpoint_id" >> "$GITHUB_OUTPUT"

          branch_json=$(curl --silent --show-error --fail "${AUTH[@]}" "$API/branches/$branch_id")
          actual_name=$(jq -r '.branch.name // empty' <<<"$branch_json")
          actual_parent=$(jq -r '.branch.parent_id // empty' <<<"$branch_json")
          actual_default=$(jq -r 'if .branch.default == null then "unknown" else (.branch.default | tostring) end' <<<"$branch_json")
          if [[ "$actual_name" != "$branch_name" || "$actual_parent" != "$NEON_PARENT_BRANCH_ID" || "$actual_default" != "false" ]]; then
            echo "::error::Created target failed isolated-child identity verification."
            exit 1
          fi

          endpoint_json=$(curl --silent --show-error --fail "${AUTH[@]}" "$API/endpoints/$endpoint_id")
          endpoint_branch=$(jq -r '.endpoint.branch_id // empty' <<<"$endpoint_json")
          endpoint_type=$(jq -r '.endpoint.type // empty' <<<"$endpoint_json")
          if [[ "$endpoint_branch" != "$branch_id" || "$endpoint_type" != "read_write" ]]; then
            echo "::error::Created read-write endpoint is not bound to the isolated rehearsal branch."
            exit 1
          fi

          echo "Created isolated rehearsal branch $branch_id from verified backup; endpoint identity verified."

      - name: Resolve branch-scoped migration, app and audit connections
        id: connections
        shell: bash
        run: |
          set -euo pipefail
          API="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID"
          AUTH=(-H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json")
          BRANCH_ID="${{ steps.provision.outputs.branch_id }}"
          ENDPOINT_ID="${{ steps.provision.outputs.endpoint_id }}"

          for attempt in $(seq 1 30); do
            endpoint_json=$(curl --silent --show-error --fail "${AUTH[@]}" "$API/endpoints/$ENDPOINT_ID")
            endpoint_state=$(jq -r '.endpoint.current_state // empty' <<<"$endpoint_json")
            if [[ "$endpoint_state" == "active" || "$endpoint_state" == "idle" ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$endpoint_state" != "active" && "$endpoint_state" != "idle" ]]; then
            echo "::error::New isolated Neon endpoint did not become connectable."
            exit 1
          fi

          connection_uri() {
            local role="$1"
            curl --silent --show-error --fail --get "${AUTH[@]}" \
              --data-urlencode "branch_id=$BRANCH_ID" \
              --data-urlencode "endpoint_id=$ENDPOINT_ID" \
              --data-urlencode "database_name=neondb" \
              --data-urlencode "role_name=$role" \
              --data-urlencode "pooled=false" \
              "$API/connection_uri" | jq -r '.uri // empty'
          }

          MIGRATION_URL=$(connection_uri nlc_migration_user)
          APP_URL=$(connection_uri nlc_app_role)
          AUDIT_URL=$(connection_uri nlc_ci_audit_role)
          if [[ -z "$MIGRATION_URL" || -z "$APP_URL" || -z "$AUDIT_URL" ]]; then
            echo "::error::Neon did not return all three required direct role-scoped connection URIs."
            exit 1
          fi
          for value in "$MIGRATION_URL" "$APP_URL" "$AUDIT_URL"; do
            echo "::add-mask::$value"
          done

          {
            echo "migration_url=$MIGRATION_URL"
            echo "app_url=$APP_URL"
            echo "audit_url=$AUDIT_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Verify isolated database connectivity and rehearse migrations
        shell: bash
        env:
          MIGRATION_URL: ${{ steps.connections.outputs.migration_url }}
          APP_URL: ${{ steps.connections.outputs.app_url }}
          AUDIT_URL: ${{ steps.connections.outputs.audit_url }}
          BRANCH_ID: ${{ steps.provision.outputs.branch_id }}
        run: |
          set -euo pipefail
          REHEARSAL_HMAC_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
          echo "::add-mask::$REHEARSAL_HMAC_SECRET"

          ready=false
          for attempt in $(seq 1 30); do
            if MIGRATION_DATABASE_URL="$MIGRATION_URL" python - <<'PY'
          import asyncio, os
          import asyncpg
          from app.db_url import prepare_asyncpg_connection
          from sqlalchemy.engine import make_url
          async def main():
              url, args = prepare_asyncpg_connection(os.environ["MIGRATION_DATABASE_URL"], require_tls=True)
              dsn = make_url(url).set(drivername="postgresql").render_as_string(hide_password=False)
              conn = await asyncpg.connect(dsn, **args)
              await conn.close()
          asyncio.run(main())
          PY
            then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            echo "::error::Isolated Neon compute did not become reachable as nlc_migration_user."
            exit 1
          fi

          export ENVIRONMENT=production
          export MIGRATION_DATABASE_URL="$MIGRATION_URL"
          export APP_DATABASE_URL="$APP_URL"
          export NLC_AUDIT_DATABASE_URL="$AUDIT_URL"
          export NLC_RLS_HMAC_SECRET="$REHEARSAL_HMAC_SECRET"
          export NLC_REHEARSAL_BRANCH_ID="$BRANCH_ID"
          export NLC_TARGET_BRANCH_ID="$BRANCH_ID"
          python -m py_compile scripts/rehearse_production_0112_to_0122.py
          python scripts/rehearse_production_0112_to_0122.py

      - name: Upload isolated migration rehearsal report
        if: always() && hashFiles('artifacts/neon-production-0112-to-0122.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nlc-production-0112-to-0123-rehearsal
          path: artifacts/neon-production-0112-to-0122.json
          if-no-files-found: error

      - name: Delete only the ephemeral branch created by this run
        if: always() && steps.provision.outputs.branch_id != ''
        shell: bash
        run: |
          set -euo pipefail
          API="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID"
          AUTH=(-H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json")
          BRANCH_ID="${{ steps.provision.outputs.branch_id }}"
          branch_json=$(curl --silent --show-error --fail "${AUTH[@]}" "$API/branches/$BRANCH_ID")
          branch_name=$(jq -r '.branch.name // empty' <<<"$branch_json")
          branch_parent=$(jq -r '.branch.parent_id // empty' <<<"$branch_json")
          if [[ "$branch_name" != "nlc-ci-rehearsal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || "$branch_parent" != "$NEON_PARENT_BRANCH_ID" ]]; then
            echo "::error::Refusing cleanup: branch identity no longer matches this workflow run."
            exit 1
          fi
          curl --silent --show-error --fail --request DELETE "${AUTH[@]}" "$API/branches/$BRANCH_ID" >/dev/null
          echo "Deleted this run's verified ephemeral rehearsal branch."
