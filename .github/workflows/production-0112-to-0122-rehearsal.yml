name: Production 0112 to 0128 Neon Migration Rehearsal

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "alembic/**"
      - "migrations/**"
      - "app/models/**"
      - "app/db/**"
      - "app/db_url.py"
      - "canonical_architecture/statutory_rules.py"
      - "alembic.ini"
      - "requirements.txt"
      - "scripts/rehearse_production_0112_to_0128.py"
      - ".github/workflows/production-0112-to-0122-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nlc-production-migration-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  rehearse:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: rapid-bonus-26545234
      NEON_PARENT_BRANCH_ID: br-divine-glade-aovapmi5
      PYTHONPATH: ${{ github.workspace }}
      NLC_EXPECTED_SOURCE_SHA: ${{ github.sha }}
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install migration dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Create isolated Neon child, verify target, and rehearse migrations
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NEON_API_KEY:-}" ]]; then
            echo "::error::NEON_API_KEY repository secret is required."
            exit 1
          fi

          API="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID"
          AUTH=(-H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json")
          BRANCH_ID=""
          cleanup() {
            if [[ -n "$BRANCH_ID" ]]; then
              if ! curl --silent --show-error --fail --request DELETE "${AUTH[@]}" "$API/branches/$BRANCH_ID" >/dev/null; then
                echo "::warning::Disposable Neon rehearsal branch cleanup failed; inspect branch $BRANCH_ID."
              fi
            fi
          }
          trap cleanup EXIT

          # This is a preserved backup, never the production/default branch.
          response_file=$(mktemp)
          trap 'rm -f "$response_file"; cleanup' EXIT
          neon_request() {
            local method="$1"
            local url="$2"
            local payload="${3:-}"
            local http_status=""
            local response_body=""
            local retry_after=""
            local delay=""
            local deadline=$((SECONDS + 300))
            local attempt=0
            local headers_file
            headers_file=$(mktemp)
            while (( SECONDS < deadline && attempt < 8 )); do
              attempt=$((attempt + 1))
              : > "$headers_file"
              if [[ "$method" == "POST" ]]; then
                http_status=$(curl --silent --show-error --request POST \
                  "${AUTH[@]}" -H "Content-Type: application/json" \
                  --data "$payload" -D "$headers_file" -o "$response_file" -w "%{http_code}" "$url") || {
                    rm -f "$headers_file"
                    echo "::error::Neon $method transport failure; request was not blindly retried." >&2
                    return 1
                  }
              else
                http_status=$(curl --silent --show-error \
                  "${AUTH[@]}" -D "$headers_file" -o "$response_file" -w "%{http_code}" "$url") || {
                    rm -f "$headers_file"
                    echo "::error::Neon $method transport failure." >&2
                    return 1
                  }
              fi
              response_body=$(cat "$response_file")
              if [[ "$http_status" == "423" ]]; then
                retry_after=$(awk 'BEGIN{IGNORECASE=1} /^Retry-After:/ {gsub("\\r","",$2); print $2}' "$headers_file" | tail -n 1)
                if [[ "$retry_after" =~ ^[0-9]+$ ]]; then
                  delay="$retry_after"
                elif [[ -n "$retry_after" ]]; then
                  retry_epoch=$(date -u -d "$retry_after" +%s 2>/dev/null || true)
                  if [[ "$retry_epoch" =~ ^[0-9]+$ ]]; then
                    delay=$((retry_epoch - $(date -u +%s)))
                    (( delay < 0 )) && delay=0
                  else
                    echo "::error::Neon returned an invalid Retry-After header." >&2
                    rm -f "$headers_file"
                    return 1
                  fi
                else
                  delay=$((2 ** attempt))
                  (( delay > 60 )) && delay=60
                  delay=$((delay + RANDOM % 4))
                fi
                if (( SECONDS + delay >= deadline )); then
                  rm -f "$headers_file"
                  echo "::error::Neon API lock retry would exceed the 300-second total deadline." >&2
                  return 1
                fi
                echo "Neon API locked (HTTP 423); retrying in ${delay}s (attempt ${attempt}/8)." >&2
                sleep "$delay"
                continue
              fi
              rm -f "$headers_file"
              if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
                echo "::error::Neon $method returned non-retryable HTTP $http_status: $response_body" >&2
                return 1
              fi
              printf '%s' "$response_body"
              return 0
            done
            rm -f "$headers_file"
            echo "::error::Neon API remained locked or exceeded retry deadline; failing closed." >&2
            return 1
          }

          parent_json=$(neon_request GET "$API/branches/$NEON_PARENT_BRANCH_ID")
          parent_name=$(jq -r '.branch.name // empty' <<<"$parent_json")
          parent_default=$(jq -r 'if .branch.default == null then "unknown" else (.branch.default | tostring) end' <<<"$parent_json")
          if [[ "$parent_name" != "nlc-prod-backup-2026-11-20-before-0122" || "$parent_default" != "false" ]]; then
            echo "::error::Refusing rehearsal: pinned parent is not the verified non-default production backup."
            exit 1
          fi

          # A unique disposable branch prevents stale IDs and concurrent-run collisions.
          BRANCH_NAME="nlc-0112-to-0128-rehearsal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload=$(jq -n --arg name "$BRANCH_NAME" --arg parent "$NEON_PARENT_BRANCH_ID"             '{branch:{name:$name,parent_id:$parent},endpoints:[{type:"read_write"}]}')
          created=$(neon_request POST "$API/branches" "$payload")
          BRANCH_ID=$(jq -r '.branch.id // empty' <<<"$created")
          ENDPOINT_ID=$(jq -r '.endpoints[]? | select(.type == "read_write") | .id' <<<"$created" | head -n 1)
          if [[ -z "$BRANCH_ID" || -z "$ENDPOINT_ID" ]]; then
            echo "::error::Neon did not return both the disposable branch ID and its read-write endpoint ID."
            exit 1
          fi

          branch_json=$(neon_request GET "$API/branches/$BRANCH_ID")
          branch_name=$(jq -r '.branch.name // empty' <<<"$branch_json")
          branch_parent=$(jq -r '.branch.parent_id // empty' <<<"$branch_json")
          branch_default=$(jq -r 'if .branch.default == null then "unknown" else (.branch.default | tostring) end' <<<"$branch_json")
          if [[ "$branch_name" != "$BRANCH_NAME" || "$branch_parent" != "$NEON_PARENT_BRANCH_ID" || "$branch_default" != "false" ]]; then
            echo "::error::Refusing migration: newly created target is not the expected isolated backup child."
            exit 1
          fi

          endpoint_json=$(neon_request GET "$API/endpoints/$ENDPOINT_ID")
          endpoint_branch=$(jq -r '.endpoint.branch_id // empty' <<<"$endpoint_json")
          if [[ "$endpoint_branch" != "$BRANCH_ID" ]]; then
            echo "::error::Read-write endpoint does not belong to the disposable rehearsal branch."
            exit 1
          fi

          get_uri() {
            local role="$1"
            local query="$API/connection_uri?branch_id=$BRANCH_ID&endpoint_id=$ENDPOINT_ID&database_name=neondb&role_name=$role&pooled=false"
            neon_request GET "$query" | jq -er '.uri | select(type == "string" and length > 0)'
          }

          MIGRATION_URL=$(get_uri "nlc_migration_user")
          APP_URL=$(get_uri "nlc_app_role")
          AUDIT_URL=$(get_uri "nlc_ci_audit_role")
          if [[ -z "$MIGRATION_URL" || -z "$APP_URL" || -z "$AUDIT_URL" ]]; then
            echo "::error::Neon did not return all three direct role-specific connection URIs."
            exit 1
          fi
          echo "::add-mask::$MIGRATION_URL"
          echo "::add-mask::$APP_URL"
          echo "::add-mask::$AUDIT_URL"

          REHEARSAL_HMAC_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
          echo "::add-mask::$REHEARSAL_HMAC_SECRET"

          export NLC_REHEARSAL_BRANCH_ID="$BRANCH_ID"
          export NLC_TARGET_BRANCH_ID="$BRANCH_ID"
          ready=false
          for attempt in $(seq 1 30); do
            if MIGRATION_DATABASE_URL="$MIGRATION_URL" python - <<'PY'
          import asyncio, os
          import asyncpg
          from app.db_url import prepare_asyncpg_connection
          from sqlalchemy.engine import make_url
          async def main():
              url, args = prepare_asyncpg_connection(os.environ["MIGRATION_DATABASE_URL"], require_tls=True)
              dsn = make_url(url).set(drivername="postgresql").render_as_string(hide_password=False)
              conn = await asyncpg.connect(dsn, **args, timeout=5)
              try:
                  row = await conn.fetchrow("SELECT session_user, current_user, current_database(), current_setting('neon.branch_id', true)")
                  assert row["session_user"] == "nlc_migration_user"
                  assert row["current_user"] == "nlc_migration_user"
                  assert row["current_database"] == "neondb"
                  assert row["current_setting"] == os.environ["NLC_TARGET_BRANCH_ID"]
              finally:
                  await conn.close()
          asyncio.run(main())
          PY
            then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            echo "::error::Disposable Neon compute did not become reachable with the expected migration identity and branch."
            exit 1
          fi

          export ENVIRONMENT=production
          export NLC_EXPECTED_SOURCE_SHA="$GITHUB_SHA"
          export GITHUB_PR_NUMBER="${{ github.event.pull_request.number || '' }}"
          export MIGRATION_DATABASE_URL="$MIGRATION_URL"
          export APP_DATABASE_URL="$APP_URL"
          export NLC_AUDIT_DATABASE_URL="$AUDIT_URL"
          export NLC_RLS_HMAC_SECRET="$REHEARSAL_HMAC_SECRET"
          export NLC_REHEARSAL_BRANCH_ID="$BRANCH_ID"
          export NLC_TARGET_BRANCH_ID="$BRANCH_ID"
          python -m py_compile scripts/rehearse_production_0112_to_0128.py
          python scripts/rehearse_production_0112_to_0128.py

      - name: Upload isolated migration rehearsal report
        if: always() && hashFiles('artifacts/neon-production-0112-to-0128.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nlc-production-0112-to-0128-rehearsal
          path: artifacts/neon-production-0112-to-0128.json
          if-no-files-found: error
