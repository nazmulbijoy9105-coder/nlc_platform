name: Production 0112 to 0122 Neon Migration Rehearsal

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nlc-production-0112-0122-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: rapid-bonus-26545234
      NEON_PARENT_BRANCH_ID: br-divine-glade-aovapmi5
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install migration dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Create disposable child of the preserved production backup and rehearse
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NEON_API_KEY:-}" ]]; then
            echo "::error::NEON_API_KEY repository secret is required."
            exit 1
          fi

          API="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID"
          AUTH=(-H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json")
          BRANCH_ID=""
          cleanup() {
            if [[ -n "$BRANCH_ID" ]]; then
              curl --silent --show-error --fail --request DELETE "${AUTH[@]}" \
                "$API/branches/$BRANCH_ID" >/dev/null \
                || echo "::warning::Disposable branch cleanup needs manual confirmation: $BRANCH_ID"
            fi
          }
          trap cleanup EXIT

          parent_json=$(curl --silent --show-error --fail "${AUTH[@]}" "$API/branches/$NEON_PARENT_BRANCH_ID")
          parent_name=$(jq -r '.branch.name // empty' <<<"$parent_json")
          parent_default=$(jq -r 'if .branch.default == null then "unknown" else (.branch.default | tostring) end' <<<"$parent_json")
          if [[ "$parent_name" != "nlc-prod-backup-2026-11-20-before-0122" || "$parent_default" != "false" ]]; then
            echo "::error::Refusing to run: the pinned parent is not the preserved non-default production backup."
            exit 1
          fi

          branch_name="nlc-0112-to-0122-$GITHUB_RUN_ID"
          payload=$(jq -n --arg name "$branch_name" --arg parent "$NEON_PARENT_BRANCH_ID" \
            '{branch:{name:$name,parent_id:$parent},endpoints:[{type:"read_write"}]}')
          created=$(curl --silent --show-error --fail --request POST \
            "${AUTH[@]}" -H "Content-Type: application/json" \
            --data "$payload" "$API/branches")
          BRANCH_ID=$(jq -r '.branch.id // empty' <<<"$created")
          ENDPOINT_ID=$(jq -r '.endpoints[0].id // empty' <<<"$created")
          if [[ -z "$BRANCH_ID" || -z "$ENDPOINT_ID" ]]; then
            echo "::error::Neon did not return the disposable branch and endpoint IDs."
            exit 1
          fi
          echo "Created disposable branch $BRANCH_ID from the preserved production backup."

          get_uri() {
            curl --silent --show-error --fail --get "${AUTH[@]}" \
              --data-urlencode "branch_id=$BRANCH_ID" \
              --data-urlencode "endpoint_id=$ENDPOINT_ID" \
              --data-urlencode "database_name=neondb" \
              --data-urlencode "role_name=nlc_migration_user" \
              --data-urlencode "pooled=false" \
              "$API/connection_uri" | jq -r '.uri // empty'
          }
          MIGRATION_URL=$(get_uri)
          if [[ -z "$MIGRATION_URL" ]]; then
            echo "::error::Neon did not return a direct nlc_migration_user URI."
            exit 1
          fi
          echo "::add-mask::$MIGRATION_URL"

          ready=false
          for attempt in $(seq 1 30); do
            if MIGRATION_DATABASE_URL="$MIGRATION_URL" python - <<'PY'
          import asyncio, os
          import asyncpg
          from app.db_url import prepare_asyncpg_connection
          async def main():
              url, args = prepare_asyncpg_connection(os.environ["MIGRATION_DATABASE_URL"], require_tls=True)
              conn = await asyncpg.connect(url, **args)
              await conn.close()
          asyncio.run(main())
          PY
            then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            echo "::error::Disposable Neon compute did not become reachable as nlc_migration_user."
            exit 1
          fi

          export ENVIRONMENT=production
          export MIGRATION_DATABASE_URL="$MIGRATION_URL"
          export NLC_REHEARSAL_BRANCH_ID="$BRANCH_ID"
          python -m py_compile scripts/rehearse_production_0112_to_0122.py
          python scripts/rehearse_production_0112_to_0122.py

      - name: Upload production-schema migration rehearsal report
        if: always() && hashFiles('artifacts/neon-production-0112-to-0122.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nlc-production-0112-to-0122-rehearsal
          path: artifacts/neon-production-0112-to-0122.json
          if-no-files-found: error
