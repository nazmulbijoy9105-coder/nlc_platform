name: G2 PostgreSQL migration and legal-engine rehearsal

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "alembic/**"
      - "migrations/**"
      - "app/models/**"
      - "app/db/**"
      - "app/db_url.py"
      - "app/rule_engine/**"
      - "canonical_architecture/statutory_rules.py"
      - "alembic.ini"
      - "requirements.txt"
      - "scripts/check_rule_verification.py"
      - "tests/integration/**"
      - "tests/unit/test_rjsc_scope_registry.py"
      - "tests/unit/test_evaluation_integrity.py"
      - "tests/unit/test_not_evaluated_score_visibility.py"
      - "tests/unit/test_score_release_evidence_gates.py"
      - ".github/workflows/production-0112-to-0122-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nlc-g2-postgres-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  g2-postgres:
    name: Isolated PostgreSQL G2 checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nlc_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nlc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nlc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://nlc_test@localhost:5432/nlc_test
      DATABASE_URL_TEST: postgresql+asyncpg://nlc_test@localhost:5432/nlc_test
      DATABASE_URL_TEST_MIGRATION: postgresql+asyncpg://nlc_migrator@localhost:5432/nlc_test
      MIGRATION_DATABASE_URL: postgresql+asyncpg://nlc_migrator@localhost:5432/nlc_test
      APP_DATABASE_URL: postgresql+asyncpg://nlc_app_role@localhost:5432/nlc_test
      REQUIRE_RLS_APP_ROLE: "true"
      ENVIRONMENT: test
      TESTING: "true"
      CI: "true"
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-not-a-production-secret
      NLC_RLS_HMAC_SECRET: ci-only-rls-hmac-secret-not-for-production-2026
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install pytest pytest-asyncio pytest-cov==7.1.0

      - name: Provision isolated migration, runtime and audit roles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import os
          import secrets
          import asyncpg

          async def main():
              url = os.environ["DATABASE_URL"].replace(
                  "postgresql+asyncpg://", "postgresql://", 1
              )
              conn = await asyncpg.connect(url)
              try:
                  await conn.execute("""
                      DO $$
                      BEGIN
                          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'nlc_app_role') THEN
                              CREATE ROLE nlc_app_role LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE
                                  NOINHERIT NOREPLICATION NOBYPASSRLS;
                          END IF;
                          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'nlc_migrator') THEN
                              CREATE ROLE nlc_migrator LOGIN SUPERUSER;
                          END IF;
                          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'nlc_migration_owner') THEN
                              CREATE ROLE nlc_migration_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE
                                  NOINHERIT BYPASSRLS NOREPLICATION;
                          END IF;
                          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'nlc_ci_audit_role') THEN
                              CREATE ROLE nlc_ci_audit_role LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE
                                  NOINHERIT NOREPLICATION NOBYPASSRLS;
                          END IF;
                          EXECUTE 'GRANT nlc_migration_owner TO nlc_migrator WITH ADMIN FALSE, INHERIT FALSE, SET TRUE';
                          EXECUTE 'GRANT USAGE, CREATE ON SCHEMA public TO nlc_migration_owner';
                      END
                      $$;
                  """)
                  password = secrets.token_urlsafe(32)
                  alter = await conn.fetchval(
                      "SELECT format('ALTER ROLE nlc_app_role WITH PASSWORD %L', $1::text)",
                      password,
                  )
                  await conn.execute(alter)
              finally:
                  await conn.close()

              password = password
              values = {
                  "APP_DATABASE_PASSWORD": password,
                  "APP_DATABASE_URL": (
                      "postgresql+asyncpg://nlc_app_role:"
                      + password
                      + "@localhost:5432/nlc_test"
                  ),
                  "NLC_RLS_HMAC_SECRET": secrets.token_hex(32),
              }
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                  for key, value in values.items():
                      env.write(f"{key}={value}\n")
              for value in values.values():
                  print(f"::add-mask::{value}")

          asyncio.run(main())
          PY

      - name: Verify sole Alembic head and migrate isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          HEADS="$(alembic heads)"
          printf '%s\n' "$HEADS"
          test "$(grep -c ' (head)' <<< "$HEADS")" -eq 1
          EXPECTED_HEAD="$(awk 'NR == 1 {print $1}' <<< "$HEADS")"

          alembic upgrade head
          alembic upgrade head
          CURRENT="$(alembic current)"
          printf '%s\n' "$CURRENT"
          grep -Fq "$EXPECTED_HEAD" <<< "$CURRENT"

          PGOPTIONS='-c default_transaction_read_only=on' \
            psql -h localhost -U nlc_test -d nlc_test -X -v ON_ERROR_STOP=1 \
            -f scripts/audit_nlc_role_memberships.sql

      - name: Seed canonical 85-rule catalogue in disposable PostgreSQL
        env:
          NLC_ALLOW_DEVELOPMENT_RULE_SEED: "true"
        run: python scripts/seed_rules.py --apply

      - name: Verify independent legal approval register remains fail-closed
        run: python scripts/check_rule_verification.py

      - name: Run G2 parity, RLS, tenant-isolation, scope, integrity and withheld-score tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            tests/integration/test_rule_registry_parity.py \
            tests/integration/test_dashboard_tenant_isolation.py \
            tests/integration/test_agm_share_event_rls.py \
            tests/integration/test_legal_provenance_acl.py \
            tests/integration/test_articles_rls_security.py \
            tests/unit/test_rjsc_scope_registry.py \
            tests/unit/test_evaluation_integrity.py \
            tests/unit/test_rule_outcome_ledger.py \
            tests/unit/test_not_evaluated_score_visibility.py \
            tests/unit/test_score_release_evidence_gates.py \
            tests/unit/test_legal_approval_register_parity.py \
            -q -rs --tb=short --junitxml=/tmp/nlc-g2-postgres.xml

          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("/tmp/nlc-g2-postgres.xml").getroot()
          cases = root.findall(".//testcase")
          if not cases:
              raise SystemExit("G2 PostgreSQL suite collected zero tests")
          skipped = [case.get("name", "<unnamed>") for case in cases
                     if case.find("skipped") is not None]
          if skipped:
              raise SystemExit("G2 PostgreSQL suite must not skip: " + ", ".join(skipped))
          print(f"G2 PostgreSQL suite: {len(cases)} tests collected, zero skips.")
          PY
