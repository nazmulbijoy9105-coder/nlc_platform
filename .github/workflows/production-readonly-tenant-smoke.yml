name: Production Read-only Tenant Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nlc-production-readonly-tenant-smoke
  cancel-in-progress: false

jobs:
  production-readonly-smoke:
    name: Signed-user tenant and six-state smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NLC_PROD_API_BASE_URL: ${{ vars.NLC_PROD_API_BASE_URL || 'https://nlc-platform.onrender.com' }}
      NLC_PROD_CLIENT_BEARER: ${{ secrets.NLC_PROD_CLIENT_BEARER }}
      NLC_PROD_STAFF_BEARER: ${{ secrets.NLC_PROD_STAFF_BEARER }}
      NLC_PROD_SUPER_ADMIN_BEARER: ${{ secrets.NLC_PROD_SUPER_ADMIN_BEARER }}
      NLC_PROD_CLIENT_COMPANY_ID: ${{ vars.NLC_PROD_CLIENT_COMPANY_ID }}
      NLC_PROD_CLIENT_FOREIGN_COMPANY_ID: ${{ vars.NLC_PROD_CLIENT_FOREIGN_COMPANY_ID }}
      NLC_PROD_STAFF_COMPANY_ID: ${{ vars.NLC_PROD_STAFF_COMPANY_ID }}
      NLC_PROD_STAFF_UNASSIGNED_COMPANY_ID: ${{ vars.NLC_PROD_STAFF_UNASSIGNED_COMPANY_ID }}
    steps:
      - name: Check out approved repository revision
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run GET-only production authorization and reporting checks
        run: python scripts/production_readonly_tenant_smoke.py
