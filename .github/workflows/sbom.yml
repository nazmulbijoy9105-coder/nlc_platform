name: SBOM

# P1: generate a CycloneDX SBOM from requirements for supply-chain review.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "40 5 * * 1"

permissions:
  contents: read

jobs:
  cyclonedx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies and CycloneDX
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cyclonedx-bom

      - name: Generate SBOM
        run: |
          mkdir -p artifacts
          cyclonedx-py environment -o artifacts/sbom.cdx.json --output-format json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: python-sbom
          path: artifacts/sbom.cdx.json
          if-no-files-found: error
