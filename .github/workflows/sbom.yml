name: SBOM

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "40 5 * * 1"

permissions:
  contents: read

jobs:
  cyclonedx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install application dependencies and CycloneDX CLI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cyclonedx-bom

      - name: Generate SBOM from declared application requirements
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cyclonedx-py requirements requirements.txt --output-format JSON --output-file artifacts/sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: python-sbom
          path: artifacts/sbom.cdx.json
          if-no-files-found: error
