name: Migration identity SQL regression

on:
  pull_request:
    paths:
      - "scripts/fixes/01_migration_identity.sql"
      - "scripts/fixes/README.md"
      - "tests/unit/test_migration_identity_sql.py"
      - ".github/workflows/migration-identity-regression.yml"

permissions:
  contents: read

jobs:
  migration-identity-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --no-cache-dir pytest
      - name: Run migration identity regression tests
        run: python -m pytest -q --confcutdir=tests/unit tests/unit/test_migration_identity_sql.py
