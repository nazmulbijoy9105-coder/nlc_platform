name: Legal engine assurance

# P0 legal-engine chain — independent of infrastructure release green.
# Required evidence classes:
#   1. 85-rule catalogue integrity (engine ↔ seed static parity + six-state funnel)
#   2. RJSC scope isolation (OUT_OF_SCOPE cannot move score/band/hash)
#   3. Score provenance fields on integrity path
#   4. Fail-closed publication / withheld scores
# Human approval audit + full product E2E remain documented follow-ups.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  legal-engine-p0:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://dummy:dummy@localhost:5432/dummy
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-jwt-secret-not-for-production-2026
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Static 85-rule engine/seed ID parity
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python tools/audit_rule_parity.py --no-db --no-api \
            --report-json artifacts/rule-registry-static-parity.json

      - name: Six-state coverage funnel (registered/implemented/deferred)
        run: |
          set -euo pipefail
          python -m canonical_architecture.coverage_report \
            --output artifacts/rule-coverage-report.json

      - name: Catalogue count and RJSC scope registry (85 + 26 OUT_OF_SCOPE)
        run: |
          python - <<'PY'
          from canonical_architecture.rjsc_scope import (
              RJSC_IN_SCOPE_RULE_IDS,
              RJSC_OUT_OF_SCOPE_RULE_IDS,
              RJSC_RULE_SCOPE,
              assert_rjsc_scope_parity,
          )
          from canonical_architecture.statutory_rules import STATUTORY_RULE_REGISTRY

          assert len(STATUTORY_RULE_REGISTRY) == 85, len(STATUTORY_RULE_REGISTRY)
          assert len(RJSC_RULE_SCOPE) == 85, len(RJSC_RULE_SCOPE)
          assert len(RJSC_OUT_OF_SCOPE_RULE_IDS) == 26, len(RJSC_OUT_OF_SCOPE_RULE_IDS)
          assert_rjsc_scope_parity(STATUTORY_RULE_REGISTRY)
          assert RJSC_IN_SCOPE_RULE_IDS.isdisjoint(RJSC_OUT_OF_SCOPE_RULE_IDS)
          assert RJSC_IN_SCOPE_RULE_IDS | RJSC_OUT_OF_SCOPE_RULE_IDS == set(STATUTORY_RULE_REGISTRY)
          print(
              f"catalogue=85 in_scope={len(RJSC_IN_SCOPE_RULE_IDS)} "
              f"out_of_scope={len(RJSC_OUT_OF_SCOPE_RULE_IDS)}"
          )
          PY

      - name: RJSC scope isolation and OUT_OF_SCOPE injection invariance
        run: |
          python -m pytest tests/unit/test_rjsc_scope_registry.py -q --tb=short

      - name: Fail-closed publication and score visibility gates
        run: |
          python -m pytest tests/unit/test_not_evaluated_score_visibility.py -q --tb=short

      - name: Evaluation integrity and score provenance
        run: |
          python -m pytest tests/unit/test_evaluation_integrity.py -q --tb=short

      - name: Score release evidence gates
        run: |
          if [[ -f tests/unit/test_score_release_evidence_gates.py ]]; then
            python -m pytest tests/unit/test_score_release_evidence_gates.py -q --tb=short
          else
            echo "score release evidence module absent; skipping"
          fi

      - name: Rule outcome ledger binding
        run: |
          if [[ -f tests/unit/test_rule_outcome_ledger.py ]]; then
            python -m pytest tests/unit/test_rule_outcome_ledger.py -q --tb=short
          fi

      - name: Upload legal-engine assurance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legal-engine-assurance
          path: |
            artifacts/rule-registry-static-parity.json
            artifacts/rule-coverage-report.json
          if-no-files-found: warn
