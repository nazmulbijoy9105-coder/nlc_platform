name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/agm-schema-forward-reconcile-clean-20261103]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://dummy:dummy@localhost:5432/dummy

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Compile check
        run: python -m compileall app/

      - name: Run unit tests
        run: python -m pytest tests/unit -q --tb=short

      - name: Rule parity audit
        run: python tools/audit_rule_parity.py --no-db

      - name: Rule verification status check
        run: python scripts/check_rule_verification.py

  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: nlc_test
          POSTGRES_PASSWORD: nlc_test
          POSTGRES_DB: nlc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nlc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://nlc_test:nlc_test@localhost:5432/nlc_test
      DATABASE_URL_TEST: postgresql+asyncpg://nlc_test:nlc_test@localhost:5432/nlc_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: test-secret-key-not-for-production
      NLC_RLS_HMAC_SECRET: ci-rls-only-secret-not-for-production-0123456789abcdef
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Compile check
        run: python -m compileall app/

      - name: Verify integration database and Redis
        run: |
          python - <<'PY'
          import asyncio
          import os
          from sqlalchemy.ext.asyncio import create_async_engine
          from redis.asyncio import Redis

          async def main():
              engine = create_async_engine(os.environ["DATABASE_URL_TEST"])
              try:
                  async with engine.connect() as connection:
                      result = await connection.exec_driver_sql("SELECT 1")
                      assert result.scalar_one() == 1
              finally:
                  await engine.dispose()

              client = Redis.from_url(os.environ["REDIS_URL"])
              try:
                  assert await client.ping()
              finally:
                  await client.aclose()

          asyncio.run(main())
          PY

      - name: Validate Alembic upgrade from empty PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://nlc_test:nlc_test@localhost:5432/nlc_migration_test
        run: |
          ADMIN_DATABASE_URL="${DATABASE_URL/postgresql+asyncpg:/postgresql:}"
          ADMIN_DATABASE_URL="${ADMIN_DATABASE_URL%/nlc_migration_test}/postgres"
          psql "$ADMIN_DATABASE_URL" -c "CREATE DATABASE nlc_migration_test"
          alembic upgrade head
          alembic current

      - name: Run integration tests
        run: python -m pytest tests/integration -q -rs --tb=short

      - name: Run canonical integrity tests
        run: python -m pytest tests/test_canonical_integrity.py -q --tb=short
