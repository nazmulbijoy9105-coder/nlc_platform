name: CI

on:
  push:
    branches:
      - main
      - fix/nlc-canonical-release-gates-20261105
      - fix/commercial-lifecycle-locks-and-ci-secret-20261108
      - fix/commercial-lifecycle-concurrency-main-20261108
      - fix/commercial-lock-order-on-160-20261108
      - feat/manual-mobile-wallet-payments-20261108
      - repair/current-head-commercial-subscription-20261108
      - fix/scoring-release-boundary-20261108
      - fix/canonical-scoring-release-head-20261108
      - fix/canonical-legal-rule-seed-sync-20261108
  pull_request:
    branches:
      - main
      - fix/0050-role-provisioning-preflight-20261106
      - fix/canonical-migration-chain-20261106
      - feat/finance-ledger-integrated-on-canonical-chain-20261106
      - feat/subscriptions-on-canonical-20261108b
      - repair/nlc-canonical-release-20261108b

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://dummy:dummy@localhost:5432/dummy

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PDF native test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libharfbuzz-subset0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Compile check
        run: python -m compileall app/

      - name: Lint scoring and migration release changes
        run: |
          ruff check --select E4,E7,E9,F \
            app/services/company_service.py \
            app/services/pdf_report_service.py \
            app/services/rescue_service.py \
            app/services/commercial_service.py \
            tests/unit/test_pdf_report_service.py \
            tests/unit/test_rescue_engagement_contract.py

      - name: Type-check scoring release-boundary services
        run: |
          mypy app/services/company_service.py \
            app/services/pdf_report_service.py \
            app/services/rescue_service.py
          ruff check --select E,F app/services/bd_calendar_generator.py \
            app/services/commercial_service.py
          ruff check --select E4,E7,E9,F app/services/bd_calendar_generator.py \
            app/api/commercial.py app/models/commercial.py app/services/commercial_service.py \
            app/api/finance.py app/models/finance.py app/services/finance_service.py \
            app/api/subscriptions.py app/models/subscription.py app/services/subscription_service.py \
            app/core/entitlement.py app/core/company_authorization.py app/core/dependencies.py \
            app/services/company_service.py app/api/calendar.py app/api/companies.py \
            app/api/documents.py app/api/rescue.py app/api/rjsc_forms.py \
            app/worker/tasks/core.py app/worker/beat_schedule.py app/worker/celery_app.py \
            tests/integration/test_dashboard_tenant_isolation.py tests/integration/test_api.py \
            tests/integration/test_financial_review_actor_binding.py \
            tests/integration/test_finance_wallet_reference_integrity.py \
            tests/integration/test_finance_cross_table_wallet_reference_guard.py \
            app/api/subscriptions.py app/api/rjsc_forms.py app/core/entitlement.py \
            app/core/company_authorization.py app/models/subscription.py \
            app/services/subscription_service.py \
            app/worker/beat_schedule.py \
            app/core/dependencies.py \
            tests/unit/test_pdf_report_service.py \
            tests/unit/test_rescue_engagement_contract.py \
            tests/unit/test_rule_engine_factory.py \
            tests/unit/test_share_compliance_event_rules.py \
            tests/unit/test_agm_notice_evidence_gating.py \
            tests/integration/test_agm_share_event_rls.py \
            app/api/filings.py app/models/filings.py app/models/people.py \
            app/models/company.py app/models/__init__.py app/rule_engine/engine.py \
            app/services/filing_service.py \
            alembic/versions/0081_merge_release_and_articles_wallet_heads.py \
            alembic/versions/0086_runtime_role_membership_preflight.py \
            alembic/versions/0087_legal_staff_company_scope.py \
            alembic/versions/0082_agm_share_event_provenance.py

      - name: Type-check scoring release services
        run: |
          mypy app/services/company_service.py \
            app/services/pdf_report_service.py \
            app/services/rescue_service.py \
            app/services/filing_service.py \
            app/rule_engine/engine.py

      - name: Verify single Alembic head
        run: |
          alembic heads
          HEAD_COUNT="$(alembic heads | grep -c '(head)')"
          test "$HEAD_COUNT" -eq 1

      - name: Run unit tests
        run: python -m pytest tests/unit -q --tb=short

      - name: Static engine/seed rule parity audit
        run: python tools/audit_rule_parity.py --no-db --no-api

      # Live DB/API parity is a separate release gate in production-parity.yml.
      # It must be dispatched after the read-only audit role and API are ready.

      - name: Rule verification status check
        run: python scripts/check_rule_verification.py

  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: nlc_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nlc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nlc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://nlc_test@localhost:5432/nlc_test
      DATABASE_URL_TEST: postgresql+asyncpg://nlc_test@localhost:5432/nlc_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: test-secret-key-not-for-production
      NLC_RLS_HMAC_SECRET: ci-only-rls-hmac-secret-not-for-production-2026
      APP_DATABASE_URL: postgresql+asyncpg://nlc_app_role@localhost:5432/nlc_test
      REQUIRE_RLS_APP_ROLE: "true"
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Compile check
        run: python -m compileall app/

      - name: Generate ephemeral CI security credentials
        run: |
          python - <<'PY'
          import os
          import secrets

          password = secrets.token_urlsafe(32)
          values = {
              "APP_DATABASE_PASSWORD": password,
              "APP_DATABASE_URL": f"postgresql+asyncpg://nlc_app_role:{password}@localhost:5432/nlc_test",
              "JWT_SECRET_KEY": secrets.token_urlsafe(48),
              "NLC_RLS_HMAC_SECRET": secrets.token_hex(32),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in values.items():
                  env.write(f"{key}={value}\n")
          for value in values.values():
              print(f"::add-mask::{value}")
          PY

      - name: Verify single Alembic head and two fresh PostgreSQL upgrades
        run: |
          set -euo pipefail
          HEADS="$(alembic heads)"
          printf '%s\n' "$HEADS"
          HEAD_COUNT="$(printf '%s\n' "$HEADS" | grep -c '(head)')"
          test "$HEAD_COUNT" -eq 1

          # Roles are cluster-level objects: provision them before Alembic.
          # The CI PostgreSQL service user is the isolated test-cluster administrator.
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def main():
              url = os.environ["DATABASE_URL"].replace(
                  "postgresql+asyncpg://", "postgresql://", 1
              )
              conn = await asyncpg.connect(url)
              try:
                  await conn.execute("""
                      DO $$
                      BEGIN
                          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'nlc_app_role') THEN
                              CREATE ROLE nlc_app_role LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE
                                  NOINHERIT NOREPLICATION NOBYPASSRLS;
                          END IF;
                          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'nlc_ci_audit_role') THEN
                              CREATE ROLE nlc_ci_audit_role LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE
                                  NOINHERIT NOREPLICATION NOBYPASSRLS;
                          END IF;
                      END
                      $$;
                  """)
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

          # First clean PostgreSQL database: upgrade twice to prove idempotency.
          alembic upgrade head
          alembic upgrade head
          alembic current

          # Ensure the runtime role can log in. The app pool must connect as
          # nlc_app_role itself, not as the migration owner; CI uses local trust auth.
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def main():
              url = os.environ["DATABASE_URL"].replace(
                  "postgresql+asyncpg://", "postgresql://", 1
              )
              conn = await asyncpg.connect(url)
              try:
                  await conn.execute(
                      "ALTER ROLE nlc_app_role WITH LOGIN"
                  )
                  password = os.environ["APP_DATABASE_PASSWORD"]
                  alter_role = await conn.fetchval(
                      "SELECT format('ALTER ROLE nlc_app_role WITH PASSWORD %L', $1::text)",
                      password,
                  )
                  await conn.execute(alter_role)
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

          # A second independent empty database catches hidden dependence on
          # migration state left by the first upgrade.
          createdb -h localhost -U nlc_test nlc_test_second
          SECOND_DATABASE_URL="postgresql+asyncpg://nlc_test@localhost:5432/nlc_test_second"
          DATABASE_URL="$SECOND_DATABASE_URL" alembic upgrade head
          DATABASE_URL="$SECOND_DATABASE_URL" alembic upgrade head
          DATABASE_URL="$SECOND_DATABASE_URL" alembic current

          # Move to the revision immediately after the forward-only legal-evidence
          # migration. The guard must reject crossing 0076 without deleting evidence.
          DATABASE_URL="$SECOND_DATABASE_URL" alembic downgrade 0076_company_charge_evidence
          BEFORE_DOWNGRADE="$(DATABASE_URL="$SECOND_DATABASE_URL" alembic current)"
          if DATABASE_URL="$SECOND_DATABASE_URL" alembic downgrade 0075_director_transfer_evidence; then
            echo "ERROR: forward-only legal-evidence migration unexpectedly downgraded"
            exit 1
          fi
          AFTER_DOWNGRADE="$(DATABASE_URL="$SECOND_DATABASE_URL" alembic current)"
          test "$BEFORE_DOWNGRADE" = "$AFTER_DOWNGRADE"
          # Re-apply the merged head to prove idempotent upgrade behavior.
          DATABASE_URL="$SECOND_DATABASE_URL" alembic upgrade head
          DATABASE_URL="$SECOND_DATABASE_URL" alembic current
      - name: Migrate a fresh database from revision 0042 through head
        run: |
          set -euo pipefail
          createdb -h localhost -U nlc_test nlc_test_baseline_0042
          BASELINE_DATABASE_URL="postgresql+asyncpg://nlc_test@localhost:5432/nlc_test_baseline_0042"

          # Apply migrations to a fresh isolated database, first advancing it to
          # revision 0042 and then through head. This validates the forward
          # chain from that revision; it is NOT a restored production snapshot.
          DATABASE_URL="$BASELINE_DATABASE_URL" alembic upgrade 0042_dedup_key
          DATABASE_URL="$BASELINE_DATABASE_URL" alembic upgrade head
          CURRENT="$(DATABASE_URL="$BASELINE_DATABASE_URL" alembic current)"
          printf '%s\n' "$CURRENT"
          HEADS="$(alembic heads)"
          HEAD_COUNT="$(grep -c ' (head)' <<< "$HEADS")"
          test "$HEAD_COUNT" -eq 1
          HEAD_REVISION="$(awk 'NR == 1 {print $1}' <<< "$HEADS")"
          grep -q "$HEAD_REVISION" <<< "$CURRENT"

          # Export the resulting schema snapshot for independent review.
          pg_dump -h localhost -U nlc_test \
            --schema-only --no-owner --no-privileges nlc_test_baseline_0042 \
            > /tmp/nlc_0042_to_head_schema.sql
          test -s /tmp/nlc_0042_to_head_schema.sql

      - name: Rehearse historical Articles branch from revision 0048 through head
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def main():
              url = os.environ["DATABASE_URL"].replace(
                  "postgresql+asyncpg://", "postgresql://", 1
              )
              admin_url = url.rsplit("/", 1)[0] + "/postgres"
              conn = await asyncpg.connect(admin_url)
              try:
                  await conn.execute("CREATE DATABASE nlc_test_legacy_0048")
              finally:
                  await conn.close()

          asyncio.run(main())
          PY
          LEGACY_DATABASE_URL="postgresql+asyncpg://nlc_test@localhost:5432/nlc_test_legacy_0048"

          # Recreate the historical deployed revision using the real migration
          # path, then prove that the canonical branch can continue from it.
          DATABASE_URL="$LEGACY_DATABASE_URL" alembic upgrade 0048_articles_verification
          LEGACY_MARKER="$(DATABASE_URL="$LEGACY_DATABASE_URL" alembic current)"
          printf '%s\n' "$LEGACY_MARKER"
          grep -q "0048_articles_verification" <<< "$LEGACY_MARKER"

          DATABASE_URL="$LEGACY_DATABASE_URL" alembic upgrade head
          FINAL_MARKER="$(DATABASE_URL="$LEGACY_DATABASE_URL" alembic current)"
          printf '%s\n' "$FINAL_MARKER"
          HEAD_REVISION="$(alembic heads | awk 'NR == 1 {print $1}')"
          grep -q "$HEAD_REVISION" <<< "$FINAL_MARKER"
          grep -q "0087_legal_staff_company_scope" <<< "$FINAL_MARKER"

      - name: Upload isolated migration rehearsal schema
        uses: actions/upload-artifact@v4
        with:
          name: nlc-legal-migration-0042-to-head
          path: /tmp/nlc_0042_to_head_schema.sql
          retention-days: 1

      - name: Run integration tests
        run: python -m pytest tests/integration -q --tb=short

      - name: Run finance concurrency regression tests explicitly
        run: python -m pytest tests/integration/test_finance_concurrency.py -q --tb=short

      - name: Run commercial concurrency regression tests explicitly
        run: python -m pytest tests/integration/test_commercial_concurrency.py -q --tb=short

      - name: Run canonical integrity tests
        run: python -m pytest tests/unit/test_canonical_integrity.py -q --tb=short

  docker-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build production API image
        run: docker build --target api -t nlc-api:ci .
      - name: Verify API startup command preserves PID 1 signal delivery
        run: |
          python - <<'PY'
          import json
          import subprocess

          raw = subprocess.check_output(
              ["docker", "image", "inspect", "nlc-api:ci", "--format", "{{json .Config.Cmd}}"],
              text=True,
          )
          command = json.loads(raw)
          expected = [
              "sh",
              "-c",
              "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000",
          ]
          if command != expected:
              raise SystemExit(f"Unexpected API startup command: {command!r}")
          print("API startup command uses exec for direct Uvicorn PID 1 signal handling")
          PY

      - name: Verify Fontconfig cache is writable as non-root runtime user
        run: |
          docker run --rm --entrypoint /bin/sh nlc-api:ci -c '
            id
            test -w "$XDG_CACHE_HOME/fontconfig"
            fc-cache -f
            fc-match "Noto Sans"
          '
