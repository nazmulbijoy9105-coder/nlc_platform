name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nlc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nlc_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/nlc_test
      ENVIRONMENT: testing
      ADMIN_EMAIL: admin@test.local
      ADMIN_PASSWORD: AdminPass1!
      JWT_SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
      TESTING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Prepare database
        run: |
          python -m alembic upgrade head
          python -c "
          import asyncio
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text
          import bcrypt
          import uuid
          async def seed():
              engine = create_async_engine('postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/nlc_test')
              async with engine.begin() as conn:
                  hashed = bcrypt.hashpw('AdminPass1!'.encode(), bcrypt.gensalt()).decode()
                  await conn.execute(text(f\"\"\"
                      INSERT INTO users (id, email, full_name, role, password_hash, is_active, created_at, updated_at)
                      VALUES ('{uuid.uuid4()}', 'admin@test.local', 'Test Admin', 'SUPER_ADMIN', '{hashed}', true, NOW(), NOW())
                      ON CONFLICT (email) DO UPDATE SET password_hash = EXCLUDED.password_hash, is_active = true
                  \"\"\"))
              await engine.dispose()
          asyncio.run(seed())
          "
      - name: Run tests
        run: |
          pytest tests/ --tb=short -q
          pytest tests/unit/test_rule_engine.py --tb=short -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff 2>/dev/null || true
      - run: ruff check app/ --select=E,F || true
