name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://dummy:dummy@localhost:5432/dummy

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Compile check
        run: python -m compileall app/

      - name: Verify single Alembic head
        run: |
          alembic heads
          HEAD_COUNT="$(alembic heads | grep -c '(head)')"
          test "$HEAD_COUNT" -eq 1

      - name: Run unit tests
        run: python -m pytest tests/unit -q --tb=short

      - name: Static engine/seed rule parity audit
        run: python tools/audit_rule_parity.py --no-db --no-api

      # Live DB/API parity is a separate release gate in production-parity.yml.
      # It must be dispatched after the read-only audit role and API are ready.

      - name: Rule verification status check
        run: python scripts/check_rule_verification.py

  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: nlc_test
          POSTGRES_PASSWORD: nlc_test
          POSTGRES_DB: nlc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nlc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://nlc_test:nlc_test@localhost:5432/nlc_test
      DATABASE_URL_TEST: postgresql+asyncpg://nlc_test:nlc_test@localhost:5432/nlc_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: test-secret-key-not-for-production
      NLC_RLS_HMAC_SECRET: ci-only-rls-hmac-secret-not-for-production-2026
      REQUIRE_RLS_APP_ROLE: "false"
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Compile check
        run: python -m compileall app/

      - name: Run integration tests
        run: python -m pytest tests/integration -q --tb=short

      - name: Run canonical integrity tests
        run: python -m pytest tests/test_canonical_integrity.py -q --tb=short

  docker-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build production API image
        run: docker build --target api -t nlc-api:ci .
      - name: Verify Fontconfig cache is writable as non-root runtime user
        run: |
          docker run --rm --entrypoint /bin/sh nlc-api:ci -c '
            id
            test -w "$XDG_CACHE_HOME/fontconfig"
            fc-cache -f
            fc-match "Noto Sans"
          '
