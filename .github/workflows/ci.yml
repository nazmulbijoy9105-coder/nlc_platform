name: CI

on:
  push:
    branches: [main, fix/nlc-canonical-release-gates-20261105]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://dummy:dummy@localhost:5432/dummy

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Compile check
        run: python -m compileall app/

      - name: Verify single Alembic head
        run: |
          alembic heads
          HEAD_COUNT="$(alembic heads | grep -c '(head)')"
          test "$HEAD_COUNT" -eq 1

      - name: Run unit tests
        run: python -m pytest tests/unit -q --tb=short

      - name: Static engine/seed rule parity audit
        run: python tools/audit_rule_parity.py --no-db --no-api

      # Live DB/API parity is a separate release gate in production-parity.yml.
      # It must be dispatched after the read-only audit role and API are ready.

      - name: Rule verification status check
        run: python scripts/check_rule_verification.py

  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: nlc_test
          POSTGRES_PASSWORD: nlc_test
          POSTGRES_DB: nlc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nlc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://nlc_test:nlc_test@localhost:5432/nlc_test
      DATABASE_URL_TEST: postgresql+asyncpg://nlc_test:nlc_test@localhost:5432/nlc_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: test-secret-key-not-for-production
      NLC_RLS_HMAC_SECRET: ci-only-rls-hmac-secret-not-for-production-2026
      APP_DATABASE_URL: postgresql+asyncpg://nlc_app_role:ci-only-nlc-app-role-password@localhost:5432/nlc_test
      REQUIRE_RLS_APP_ROLE: "true"
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Compile check
        run: python -m compileall app/

      - name: Verify single Alembic head and two fresh PostgreSQL upgrades
        run: |
          set -euo pipefail
          HEADS="$(alembic heads)"
          printf '%s\n' "$HEADS"
          HEAD_COUNT="$(printf '%s\n' "$HEADS" | grep -c '(head)')"
          test "$HEAD_COUNT" -eq 1

          # First clean PostgreSQL database: upgrade twice to prove idempotency.
          alembic upgrade head
          alembic upgrade head
          alembic current

          # Provision a CI-only credential for the runtime role. The app pool
          # must connect as nlc_app_role itself, not as the migration owner.
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def main():
              url = os.environ["DATABASE_URL"].replace(
                  "postgresql+asyncpg://", "postgresql://", 1
              )
              conn = await asyncpg.connect(url)
              try:
                  await conn.execute(
                      "ALTER ROLE nlc_app_role WITH PASSWORD 'ci-only-nlc-app-role-password'"
                  )
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

          # A second independent empty database catches hidden dependence on
          # migration state left by the first upgrade.
          PGPASSWORD=nlc_test createdb -h localhost -U nlc_test nlc_test_second
          SECOND_DATABASE_URL="postgresql+asyncpg://nlc_test:nlc_test@localhost:5432/nlc_test_second"
          DATABASE_URL="$SECOND_DATABASE_URL" alembic upgrade head
          DATABASE_URL="$SECOND_DATABASE_URL" alembic upgrade head
          DATABASE_URL="$SECOND_DATABASE_URL" alembic current

      - name: Run integration tests
        run: python -m pytest tests/integration -q --tb=short

      - name: Run canonical integrity tests
        run: python -m pytest tests/test_canonical_integrity.py -q --tb=short

  docker-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build production API image
        run: docker build --target api -t nlc-api:ci .
      - name: Verify Fontconfig cache is writable as non-root runtime user
        run: |
          docker run --rm --entrypoint /bin/sh nlc-api:ci -c '
            id
            test -w "$XDG_CACHE_HOME/fontconfig"
            fc-cache -f
            fc-match "Noto Sans"
          '
