name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nlc_user
          POSTGRES_PASSWORD: nlc_password
          POSTGRES_DB: nlc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://nlc_user:nlc_password@localhost:5432/nlc_test
      JWT_SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
      ENVIRONMENT: testing
      TESTING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        run: pytest tests/unit -q --tb=short
      - name: Verify rule count
        run: |
          COUNT=$(grep -oE 'rule_id="[^"]+"' app/rule_engine/engine.py | sed 's/rule_id="//;s/"//' | sort -u | wc -l)
          echo "Engine rules: $COUNT"
          if [ "$COUNT" -lt 59 ]; then echo "✗ Rule count below 59"; exit 1; fi
          echo "✓ Rule count OK ($COUNT)"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff 2>/dev/null || true
      - run: ruff check app/ --select=E,F || true

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify migrations
        run: |
          python3 -c "
          import ast, os
          for f in sorted(os.listdir('alembic/versions')):
              if f.endswith('.py'):
                  with open(f'alembic/versions/{f}') as fh:
                      ast.parse(fh.read())
          print('✓ All migrations are valid Python')
          "
