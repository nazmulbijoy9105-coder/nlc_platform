# Separate Render Blueprint for background execution only.
# No API service is defined here; applying this Blueprint creates two workers.
# Keep autoDeploy disabled until secrets and service health checks are reviewed.
services:
  - type: worker
    name: nlc-platform-worker
    runtime: docker
    region: singapore
    plan: starter
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: NLC_RLS_HMAC_SECRET
        sync: false
      - key: REQUIRE_RLS_APP_ROLE
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"

  - type: worker
    name: nlc-platform-beat
    runtime: docker
    region: singapore
    plan: starter
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.worker.celery_app beat --loglevel=info --scheduler redbeat.RedBeatScheduler
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: NLC_RLS_HMAC_SECRET
        sync: false
      - key: REQUIRE_RLS_APP_ROLE
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"
