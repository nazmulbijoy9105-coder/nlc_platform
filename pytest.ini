[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = --tb=short -q
markers =
    unit: mark test as a unit test
    rule: mark test as a rule engine test
    black: mark test as a black override test
    integration: mark test as an integration test
testpaths = tests/unit
