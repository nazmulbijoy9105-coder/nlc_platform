# ===================================================================
# NEUM LEX COUNSEL — Alembic Configuration
# alembic.ini
#
# GOVERNED MIGRATION POLICY
#
# Local development only:
#   alembic upgrade head
#   alembic current
#   alembic history --verbose
#   alembic revision --autogenerate -m "description"
#
# Controlled release:
#   Migrations execute only through the approved CI/release workflow after
#   graph, fresh-database, production-derived restore rehearsal, data-integrity,
#   role-boundary and security gates pass.
#
# PRODUCTION PROHIBITION:
#   Do not run "alembic downgrade -1" or "alembic downgrade base" as routine
#   rollback commands. Do not use manual SQL, stamping, or seed scripts to
#   reconcile legal-rule registry state.
#
# Recovery preference:
#   1. Reviewed forward-fix migration.
#   2. PITR restore into a separate branch, validate, then controlled cutover.
#   3. Downgrade only when that exact revision has a reviewed, tested,
#      data-safe downgrade and incident-lead + authorized DBA approval.
#
# Application redeploy and database recovery are separate decisions.
# API/worker startup must never invoke Alembic or production seeding.
# ===================================================================

[alembic]
# Script location — where env.py and versions/ live
script_location = alembic

# File format for new migration revisions
file_template = %%(year)d%%(month)02d%%(day)02d_%%(hour)02d%%(minute)02d_%%(rev)s_%%(slug)s

# Timezone for revision timestamps
timezone = Asia/Dhaka

# Max length for slug in filename
truncate_slug_length = 40

# Output encoding
output_encoding = utf-8

# Alembic will read DATABASE_URL from environment (set in .env).
# Do NOT hardcode credentials here.
# The actual connection is configured in alembic/env.py via pydantic settings.
sqlalchemy.url =

# -- Logging ----------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
